name: Update Google Scholar citations

on:
  schedule:
    - cron: "23 */12 * * *"
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - ".github/workflows/update-scholar-citations.yml"
      - "astro-site/scripts/update-scholar-stats.py"

permissions:
  contents: write

concurrency:
  group: scholar-citations
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch Google Scholar citation count
        env:
          SCHOLAR_ID: KJSB8EkAAAAJ
          SCHOLAR_FALLBACK_URL: https://cse.bth.se/~fer/googlescholar-api/googlescholar.php?user=KJSB8EkAAAAJ
        run: python astro-site/scripts/update-scholar-stats.py

      - name: Commit updated citation count
        run: |
          if git diff --quiet -- astro-site/src/content/bio.md; then
            echo "Citation count is unchanged."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add astro-site/src/content/bio.md
          git commit -m "chore: update Google Scholar citations"
          git push
